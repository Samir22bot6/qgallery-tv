<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QGallery - Proyección en Vivo</title>
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Generador de QR -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { margin: 0; background-color: #050505; color: #fff; display: flex; height: 100vh; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
        .main-screen { flex: 1; display: flex; justify-content: center; align-items: center; position: relative; }
        #slideImage { max-width: 90%; max-height: 90%; object-fit: contain; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); animation: fadeIn 1s; }
        .side-panel { width: 340px; background: #111; border-left: 1px solid #222; display: flex; flex-direction: column; justify-content: space-between; padding: 30px; box-sizing: border-box; text-align: center; }
        h2 { color: #3b82f6; font-size: 22px; margin-bottom: 8px; }
        p { color: #888; font-size: 14px; }
        #qrcode { background: #fff; padding: 15px; border-radius: 12px; display: inline-block; margin: 20px auto; }
        #statusMessage { font-size: 18px; color: #666; position: absolute; text-align: center; padding: 20px; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div class="main-screen">
        <div id="statusMessage">Cargando transmisión...</div>
        <img id="slideImage" src="" alt="Foto en vivo" style="display:none;">
    </div>

    <div class="side-panel">
        <div>
            <h2 id="galleryTitle">QGallery</h2>
            <p>Escanea para unirte y subir tus fotos al instante</p>
        </div>
        <div id="qrcode"></div>
        <div>
            <p style="font-size: 11px;">Sincronizado en tiempo real</p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://okbiomrgknyiseglfnih.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9rYmlvbXJna255aXNlZ2xmbmloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyOTQ3MjEsImV4cCI6MjEwNTg3MDcyMX0.wWha0ewnwGVIpS_8osI8nYnGFIQsUcf03vb4kPCV-T8';

        const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const urlParams = new URLSearchParams(window.location.search);
        const galleryId = urlParams.get('id');

        let photos = [];
        let currentIndex = 0;
        let slideInterval = null;

        async function init() {
            const statusEl = document.getElementById('statusMessage');

            if (!galleryId) {
                statusEl.innerText = "Error: Falta el parámetro ?id= en la URL";
                return;
            }

            try {
                // 1. Obtener la información de la galería
                const { data: gallery, error: galError } = await client
                    .from('galleries')
                    .select('title, qr_token')
                    .eq('id', galleryId)
                    .single();

                if (galError) {
                    statusEl.innerText = "Error al conectar con la galería: " + galError.message;
                    return;
                }

                if (gallery) {
                    document.getElementById('galleryTitle').innerText = gallery.title || "Galería en Vivo";
                    
                    // Generar el código QR con el token o ID
                    const qrText = gallery.qr_token ? gallery.qr_token : galleryId;
                    document.getElementById("qrcode").innerHTML = "";
                    new QRCode(document.getElementById("qrcode"), {
                        text: qrText,
                        width: 170,
                        height: 170
                    });
                }

                // 2. Cargar las fotos aprobadas iniciales
                await loadApprovedPhotos();

                // 3. Escuchar cambios en tiempo real (WebSockets de Supabase para nuevas fotos o aprobaciones)
                client.channel('public:photos')
                    .on('postgres_changes', { 
                        event: '*', 
                        schema: 'public', 
                        table: 'photos', 
                        filter: `gallery_id=eq.${galleryId}` 
                    }, payload => {
                        loadApprovedPhotos();
                    })
                    .subscribe();

            } catch (err) {
                statusEl.innerText = "Excepción de red: " + err.message;
            }
        }

        async function loadApprovedPhotos() {
            const statusEl = document.getElementById('statusMessage');
            
            const { data, error } = await client
                .from('photos')
                .select('image_url')
                .eq('gallery_id', galleryId)
                .eq('status', 'APPROVED')
                .order('created_at', { ascending: false });

            if (error) {
                statusEl.style.display = 'block';
                statusEl.innerText = "Error cargando fotos: " + error.message;
                return;
            }

            if (data && data.length > 0) {
                photos = data.map(p => p.image_url);
                statusEl.style.display = 'none';
                
                const imgElement = document.getElementById('slideImage');
                if (imgElement.style.display === 'none') {
                    imgElement.style.display = 'block';
                    showNextPhoto();
                    startSlideshow();
                }
            } else {
                statusEl.style.display = 'block';
                statusEl.innerText = "Esperando fotos aprobadas...";
                document.getElementById('slideImage').style.display = 'none';
            }
        }

        function showNextPhoto() {
            if (photos.length === 0) return;
            const imgElement = document.getElementById('slideImage');
            imgElement.src = photos[currentIndex];
            currentIndex = (currentIndex + 1) % photos.length;
        }

        function startSlideshow() {
            if (slideInterval) clearInterval(slideInterval);
            slideInterval = setInterval(showNextPhoto, 5000); // Cambia de foto cada 5 segundos
        }

        init();
    </script>
</body>
</html>
